<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- background -->
  <rect x="0" y="0" width="1000" height="420" fill="#0d1117"/>
  <rect x="0" y="0" width="1000" height="4" fill="#a5d6ff"/>

  <!-- left column -->
  <text x="56" y="150" font-size="54" font-weight="700" fill="#e6edf3">post<tspan fill="#a5d6ff">-sse</tspan></text>
  <text x="58" y="192" font-size="18" fill="#c9d1d9">SSE over fetch — POST, headers, reconnect</text>
  <text x="58" y="222" font-size="15" fill="#8b949e">the POST + headers EventSource can't do</text>

  <!-- feature chips -->
  <g font-size="15" fill="#c9d1d9">
    <rect x="56" y="256" width="150" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="131" y="278" text-anchor="middle">zero-dependency</text>
    <rect x="216" y="256" width="150" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="291" y="278" text-anchor="middle">POST + headers</text>
    <rect x="376" y="256" width="92" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="422" y="278" text-anchor="middle">~1.4 kB</text>
  </g>

  <!-- install line -->
  <text x="58" y="344" font-size="18"><tspan fill="#a5d6ff">$</tspan> <tspan fill="#c9d1d9">npm install post-sse</tspan></text>

  <!-- terminal card (right) -->
  <rect x="512" y="56" width="432" height="308" rx="12" fill="#010409" stroke="#30363d" stroke-width="1"/>
  <rect x="512" y="56" width="432" height="38" rx="12" fill="#161b22"/>
  <rect x="512" y="82" width="432" height="12" fill="#161b22"/>
  <circle cx="534" cy="75" r="5.5" fill="#ff5f56"/>
  <circle cx="553" cy="75" r="5.5" fill="#ffbd2e"/>
  <circle cx="572" cy="75" r="5.5" fill="#27c93f"/>
  <text x="728" y="80" text-anchor="middle" font-size="12" fill="#8b949e">POST /v1/chat · text/event-stream</text>

  <!-- body: the sse() loop + streaming events -->
  <text x="532" y="128" font-size="13" fill="#6e7681">// POST + headers — EventSource can't</text>
  <text x="532" y="156" font-size="14"><tspan fill="#ff7b72">for await</tspan><tspan fill="#8b949e"> (const e of </tspan><tspan fill="#a5d6ff">sse</tspan><tspan fill="#8b949e">(url))</tspan></text>
  <text x="532" y="190" font-size="14" fill="#a5d6ff">↓  events stream in</text>
  <text x="532" y="222" font-size="13"><tspan fill="#8b949e">event: </tspan><tspan fill="#a5d6ff">delta</tspan><tspan fill="#8b949e">  data: {</tspan><tspan fill="#79c0ff">"text"</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a5d6ff">"Hel"</tspan><tspan fill="#8b949e">}</tspan></text>
  <text x="532" y="248" font-size="13"><tspan fill="#8b949e">event: </tspan><tspan fill="#a5d6ff">delta</tspan><tspan fill="#8b949e">  data: {</tspan><tspan fill="#79c0ff">"text"</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a5d6ff">"lo"</tspan><tspan fill="#8b949e">}</tspan></text>
  <text x="532" y="274" font-size="13"><tspan fill="#8b949e">event: </tspan><tspan fill="#a5d6ff">done</tspan><tspan fill="#8b949e">   data: [DONE]</tspan></text>
  <text x="532" y="302" font-size="13"><tspan fill="#27c93f">✓</tspan><tspan fill="#6e7681"> over fetch · reconnects · zero-dep</tspan></text>
</svg>
